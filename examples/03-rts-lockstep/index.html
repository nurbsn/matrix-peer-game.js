<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>RTS Deterministic Lockstep Simulation Demo</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .hud { display: flex; justify-content: space-between; background: #1e293b; padding: 12px 18px; border-radius: 8px; margin-bottom: 12px; }
    canvas { background: #022c22; border: 2px solid #059669; border-radius: 8px; cursor: crosshair; display: block; width: 100%; height: 350px; }
    .log-box { height: 120px; overflow-y: auto; background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 0.85rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚔️ RTS Deterministic Lockstep Engine</h1>
    <p>Model sieciowy strategii czasu rzeczywistego (jak StarCraft / AoE). Nie przesyłamy pozycji jednostek, a jedynie rozkazy kliknięć (kilkadziesiąt bajtów na rozkaz)!</p>

    <div class="hud">
      <span>Krok symulacji (Tick): <b id="tick-counter" style="color: #38bdf8;">0</b></span>
      <span>Jednostki: <b>3 czołgi</b></span>
      <span>Kliknij na mapie, aby wydać rozkaz marszu!</span>
    </div>

    <canvas id="rtsCanvas" width="800" height="350"></canvas>
    
    <div id="log-box" class="log-box"></div>
  </div>

  <script src="../../dist/nomnipeer.js"></script>
  <script>
    if (!window.nOmniPeer && !window.MatrixPeerGame) {
      document.write('<script src="../../dist/npeer.js"><\/script>');
      if (!window.nOmniPeer && !window.MatrixPeerGame) {
        document.write('<script src="../../dist/matrix-peer-game.js"><\/script>');
      }
    }
  </script>
  <script>
    const lib = window.nOmniPeer || window.MatrixPeerGame;
    if (!lib) {
      document.getElementById('log-box').innerHTML = '<span style="color:#ef4444;">Błąd: Biblioteka nOmniPeer została zablokowana przez uBlock Origin (filtr *omni*). Wyłącz uBlock i odśwież stronę.</span>';
      throw new Error('nOmniPeer not loaded');
    }
    const { LockstepEngine, TypedEventEmitter } = lib;

    // Prosty mock peer managera dla demonstracji działania Lockstepu
    class DemoPeerManager extends TypedEventEmitter {
      constructor() {
        super();
        this.peerId = 'player-1';
      }
      broadcastJson() {}
    }

    const mockPeer = new DemoPeerManager();
    const lockstep = new LockstepEngine({
      peerManager: mockPeer,
      tickDurationMs: 100, // 10 ticków symulacji na sekundę
      commandDelayTicks: 2 // Rozkazy wykonują się 2 ticki w przód
    });

    // Stan jednostek w symulacji
    const units = [
      { id: 1, x: 100, y: 150, targetX: 100, targetY: 150, color: '#38bdf8' },
      { id: 2, x: 120, y: 200, targetX: 120, targetY: 200, color: '#38bdf8' },
      { id: 3, x: 80, y: 250, targetX: 80, targetY: 250, color: '#38bdf8' }
    ];

    const logBox = document.getElementById('log-box');
    function log(text) {
      const div = document.createElement('div');
      div.textContent = text;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. Zlecanie rozkazów po kliknięciu
    const canvas = document.getElementById('rtsCanvas');
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      const cmd = lockstep.queueCommand('MOVE_SQUAD', { targetX: clickX, targetY: clickY });
      log(`[Rozkaz zaplanowany] MOVE_SQUAD do (${Math.round(clickX)}, ${Math.round(clickY)}) na Tick #${cmd.targetTick}`);
    });

    // 2. Wykonywanie zsynchronizowanego kroku symulacji
    lockstep.on('tickExecute', ({ tick, commands }) => {
      document.getElementById('tick-counter').textContent = tick;

      // Zastosuj rozkazy przydzielone do tego ticka
      for (const cmd of commands) {
        if (cmd.action === 'MOVE_SQUAD') {
          log(`[Tick #${tick} Wykonanie] Rozkaz zrealizowany! Przemieszczanie jednostek.`);
          units.forEach((u, idx) => {
            u.targetX = cmd.payload.targetX + (idx - 1) * 30;
            u.targetY = cmd.payload.targetY + (idx - 1) * 20;
          });
        }
      }

      // Krok deterministycznej fizyki jednostek
      for (const u of units) {
        const dx = u.targetX - u.x;
        const dy = u.targetY - u.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 3) {
          u.x += (dx / dist) * 4;
          u.y += (dy / dist) * 4;
        }
      }

      render();
    });

    lockstep.start();

    // Rysowanie canvasa
    const ctx = canvas.getContext('2d');
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Siatka taktyczna
      ctx.strokeStyle = '#064e3b';
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Rysowanie jednostek
      for (const u of units) {
        // Cel
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.beginPath(); ctx.moveTo(u.x, u.y); ctx.lineTo(u.targetX, u.targetY); ctx.stroke();

        // Czołg
        ctx.fillStyle = u.color;
        ctx.fillRect(u.x - 12, u.y - 12, 24, 24);
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(u.x - 12, u.y - 12, 24, 24);
      }
    }
  </script>
</body>
</html>
